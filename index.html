<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🫧</text></svg>">
<title>身体日记 · 生理与精神</title>
<style>
:root{
  --bg:#F6F1E9; --card:#FFFDF9; --ink:#4A4238; --ink2:#8A7F72; --line:#E8E0D4;
  --pink:#E7C4C4; --pink-d:#D89A9A; --blue:#B9C7CE; --blue-d:#8FA6B2;
  --green:#C6D0BC; --green-d:#A3B294; --amber:#EBD3A8; --amber-d:#D9B873;
  --r:20px; --sh:0 6px 22px rgba(120,100,80,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:0 0 60px; padding-bottom:calc(60px + env(safe-area-inset-bottom));
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:26px 0 14px}
h1{margin:0;font-size:21px;letter-spacing:.5px}
.sub{color:var(--ink2);font-size:13px;margin-top:4px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--pink-d)}
h2 .dot.b{background:var(--blue-d)} h2 .dot.g{background:var(--green-d)}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.lab{flex:1;font-size:14px}
.lab small{color:var(--ink2);font-size:11px;display:block;line-height:1.3}
.opts{display:flex;gap:6px;flex-shrink:0}
.opt{width:40px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:.15s;user-select:none;filter:saturate(.85)}
.opt:active{transform:scale(.93)}
.opt.on{border-color:var(--pink-d);background:#FBEDEC;transform:scale(1.04)}
.opt.on[data-v="3"]{border-color:#C96A6A;background:#F7E0E0}
.opt.on[data-v="2"]{border-color:var(--amber-d);background:#FBF1DE}
.opt.on[data-v="1"]{border-color:#C6D0BC;background:#F1F5EC}
.opt.on[data-v="0"]{border-color:var(--blue-d);background:#EDF2F4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--pink-d);background:#FBEDEC;font-weight:600}
input[type=text],input[type=number],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;
  padding:10px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--blue-d)}
label.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;padding:8px 12px;
  border:1.5px solid var(--line);border-radius:12px;background:#fff;user-select:none}
label.chk.on{border-color:var(--green-d);background:#F1F5EC}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar .t{flex:1;font-size:14px}
.bar .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.track{height:7px;border-radius:4px;background:#EFE8DC;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--pink-d);transition:width .4s}
.saveinfo{font-size:12px;color:var(--ink2);text-align:center;margin-top:10px;min-height:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid .dow{font-size:11px;color:var(--ink2);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:9px;background:#F0EAE0;position:relative;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#8A7F72}
.cell.p{background:var(--pink-d);color:#fff}
.cell.today{outline:2.5px solid var(--ink);outline-offset:1px}
.cell .dotp{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--blue-d)}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11px;color:var(--ink2);margin-top:12px}
.lg{width:14px;height:14px;border-radius:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{padding:10px 15px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.warn{color:#B4544C;border-color:#E4C0BC}
.stat{padding:10px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:0}
.stat .k{font-size:13px;color:var(--ink2)}
.stat .v{font-size:15px;font-weight:600;margin-top:2px}
.note{font-size:12px;color:var(--ink2);line-height:1.5;margin-top:10px}
.big{font-size:26px;font-weight:700}
.split{display:flex;gap:10px}
.split>div{flex:1;text-align:center;background:#FAF6EF;border-radius:14px;padding:12px 6px}
.split .lab2{font-size:11px;color:var(--ink2)}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:.95}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>身体日记</h1>
  <div class="sub" id="hdr">每天记一格，两个周期后就能看出规律</div>
</header>

<!-- 今日 -->
<div class="card">
  <h2><span class="dot"></span>今天</h2>
  <div class="row" style="border-bottom:0">
    <div class="lab"><small id="todayStr">—</small></div>
    <div class="opts"><button class="btn pri" id="btnToday">记今天</button></div>
  </div>
  <div class="note" id="saveInfo">数据只存在这台设备的浏览器里，不上传任何地方。</div>
</div>

<!-- 经期标记 -->
<div class="card">
  <h2><span class="dot"></span>经期状态</h2>
  <div class="chips" id="periodChips"></div>
  <div class="note" id="periodNote"></div>
</div>

<!-- 生理 -->
<div class="card">
  <h2><span class="dot b"></span>生理状态</h2>
  <div id="physRows"></div>
</div>

<!-- 精神 -->
<div class="card">
  <h2><span class="dot g"></span>精神状态</h2>
  <div id="mindRows"></div>
</div>

<!-- 生活标记 -->
<div class="card">
  <h2><span class="dot"></span>其它</h2>
  <div class="row">
    <div class="lab">喝冰的</div>
    <div class="opts"><label class="chk" id="chkCold">今天喝了</label></div>
  </div>
  <div class="row">
    <div class="lab">咖啡因<small>几杯</small></div>
    <div class="opts"><input type="number" id="inpCaff" min="0" max="10" style="width:74px"></div>
  </div>
  <div class="row">
    <div class="lab">运动</div>
    <div class="opts"><label class="chk" id="chkEx">动过了</label></div>
  </div>
  <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="lab">备注<small>任何你想记的</small></div>
    <textarea id="inpNote" rows="2" placeholder="比如：第二天反而轻松了 / 半夜疼醒"></textarea>
  </div>
</div>

<!-- 统计 -->
<div class="card">
  <h2><span class="dot"></span>规律分析</h2>
  <div id="stats"></div>
  <div class="note" id="statsNote"></div>
</div>

<!-- 热力图 -->
<div class="card">
  <h2><span class="dot b"></span>最近 12 周</h2>
  <div class="grid" id="heat"></div>
  <div class="legend">
    <span>轻</span>
    <span class="lg" style="background:#F0EAE0"></span>
    <span class="lg" style="background:#E7D4C4"></span>
    <span class="lg" style="background:#E0B49B"></span>
    <span class="lg" style="background:#D08C7A"></span>
    <span class="lg" style="background:var(--pink-d)"></span>
    <span>重</span>
    <span style="margin-left:10px">● 粉底 = 经期</span>
  </div>
</div>

<!-- 数据管理 -->
<div class="card">
  <h2><span class="dot g"></span>数据</h2>
  <div class="btns">
    <button class="btn" id="btnCsv">导出 CSV</button>
    <button class="btn" id="btnJson">导出 JSON</button>
    <button class="btn" id="btnImport">导入 JSON</button>
    <button class="btn warn" id="btnClear">清空</button>
  </div>
  <input type="file" id="fileImport" accept=".json" class="hidden">
  <div class="note" id="dataNote"></div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
const KEY='pmstracker.v1';
const FACES=[['😌',0],['🙂',1],['😕',2],['😣',3]];
const PHYS=[
 {k:'pain',   l:'痛',       h:'0 不痛 · 3 痛到要命'},
 {k:'tired',  l:'疲倦',     h:'0 精神好 · 3 累瘫'},
 {k:'bloat',  l:'腹胀',     h:'0 平的 · 3 鼓得像球'},
 {k:'head',   l:'头痛',     h:''},
 {k:'breast', l:'乳房胀',   h:''},
 {k:'flow',   l:'出血量',   h:'0 无 · 3 很多'},
];
const MIND=[
 {k:'temper', l:'脾气',     h:'0 好脾气 · 3 想砸东西'},
 {k:'mood',   l:'心情',     h:'0 低落 · 3 开心', inv:true},
 {k:'craving',l:'想找刺激', h:'想喝酒 / 想吃甜 / 想搞事', sig:true},
 {k:'focus',  l:'专注力',   h:'0 涣散 · 3 集中', inv:true},
 {k:'calm',   l:'平静',     h:'0 烦躁 · 3 安静', inv:true},
];
let S=load();

function load(){
  try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return {entries:{}};
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); flash('已保存'); }
  catch(e){ flash('保存失败：'+e.message); }
}
function flash(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),1600); }
function ymd(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a,b){ return Math.round((parseD(a)-parseD(b))/86400000); }
function today(){ return ymd(new Date()); }

/* ---------- 渲染 ---------- */
function renderRows(container, fields, ent){
  const el=document.getElementById(container);
  el.innerHTML='';
  fields.forEach(f=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML='<div class="lab">'+f.l+(f.h?'<small>'+f.h+'</small>':'')+'</div>';
    const opts=document.createElement('div'); opts.className='opts';
    FACES.forEach(([face,v])=>{
      const b=document.createElement('div');
      b.className='opt'+(ent&&ent[f.k]===v?' on':'');
      b.dataset.v=v; b.textContent=face;
      b.onclick=()=>{
        const e=getEntry(today());
        e[f.k]=(e[f.k]===v&&v!==0)?undefined:v;
        if(e[f.k]===undefined) delete e[f.k];
        S.entries[today()]=e; save(); render();
      };
      opts.appendChild(b);
    });
    row.appendChild(opts); el.appendChild(row);
  });
}
function getEntry(date){
  if(!S.entries[date]) S.entries[date]={};
  return S.entries[date];
}
function renderPeriod(){
  const el=document.getElementById('periodChips');
  el.innerHTML='';
  const cur=(S.entries[today()]||{}).periodDay||0;
  const list=[[0,'不是经期'],[1,'第1天'],[2,'第2天'],[3,'第3天'],[4,'第4天'],[5,'第5天'],[6,'第6天'],[7,'第7天+']];
  list.forEach(([v,t])=>{
    const c=document.createElement('div');
    c.className='chip'+(cur===v?' on':'');
    c.textContent=t;
    c.onclick=()=>{ const e=getEntry(today()); e.periodDay=v; save(); render(); };
    el.appendChild(c);
  });
  const starts=periodStarts();
  const n=document.getElementById('periodNote');
  if(starts.length>=2){
    const lens=[]; for(let i=1;i<starts.length;i++) lens.push(diffDays(starts[i],starts[i-1]));
    const avg=lens.reduce((a,b)=>a+b,0)/lens.length;
    n.textContent='已记录 '+starts.length+' 次经期，平均周期 '+avg.toFixed(1)+' 天。';
  }else if(starts.length===1){
    n.textContent='已记录 1 次经期。再记一次就能算周期长度了。';
  }else{
    n.textContent='标一次「第1天」，以后就能自动算周期和经前窗口。';
  }
}
function periodStarts(){
  const ds=Object.keys(S.entries).filter(d=>S.entries[d].periodDay===1).sort();
  return ds;
}
function render(){
  const t=today();
  document.getElementById('todayStr').textContent=t+'  '+(new Date().getMonth()+1)+'月'+new Date().getDate()+'日';
  renderPeriod();
  const e=S.entries[t]||{};
  renderRows('physRows',PHYS,e);
  renderRows('mindRows',MIND,e);
  document.getElementById('chkCold').classList.toggle('on',!!e.cold);
  document.getElementById('chkEx').classList.toggle('on',!!e.exercise);
  document.getElementById('inpCaff').value=e.caffeine==null?'':e.caffeine;
  document.getElementById('inpNote').value=e.note||'';
  renderStats(); renderHeat();
  document.getElementById('dataNote').textContent='共 '+Object.keys(S.entries).length+' 天记录 · '+new Date().toLocaleString('zh-CN');
}

/* ---------- 统计 ---------- */
function discomfort(f,v){ if(v==null) return null; if(f.sig) return null; return f.inv?(3-v):v; }
function entryScore(e){
  let tot=0,n=0;
  PHYS.forEach(f=>{ const v=discomfort(f,e[f.k]); if(v!=null){tot+=v;n++;} });
  MIND.forEach(f=>{ const v=discomfort(f,e[f.k]); if(v!=null){tot+=v;n++;} });
  return n?tot/n:null;
}
function nextPeriodStart(date){
  const st=periodStarts();
  for(const s of st){ if(diffDays(s,date)>0) return s; }
  return null;
}
function analyze(){
  const st=periodStarts();
  const cycles=[]; for(let i=1;i<st.length;i++) cycles.push(diffDays(st[i],st[i-1]));
  const perLens=[];
  st.forEach((s)=>{
    let len=0,d=s;
    while(S.entries[d]&&S.entries[d].periodDay>0){len++;d=addDays(d,1);}
    // 只有「已经结束」的经期段才算数：段后有非经期记录，或已过去至少 2 天
    const ended=(S.entries[d]&&S.entries[d].periodDay!==0)||diffDays(today(),d)>=2;
    if(len&&ended) perLens.push(len);
  });
  // 每个症状的经前峰值
  const leads={};
  const allFields=[].concat(PHYS,MIND);
  allFields.forEach(f=>{ leads[f.k]={}; });
  Object.keys(S.entries).forEach(date=>{
    const ns=nextPeriodStart(date); if(!ns) return;
    const lead=diffDays(ns,date); if(lead<0||lead>14) return;
    const e=S.entries[date];
    allFields.forEach(f=>{
      const v = f.sig ? e[f.k] : discomfort(f,e[f.k]);   // 信号类字段用原值（越高越强）
      if(v==null) return;
      const b=leads[f.k]; b[lead]=b[lead]||[]; b[lead].push(v);
    });
  });
  const peaks=[];
  allFields.forEach(f=>{
    const b=leads[f.k]; const keys=Object.keys(b).map(Number);
    if(!keys.length) return;
    const scored=keys.map(k=>({lead:k,avg:b[k].reduce((a,c)=>a+c,0)/b[k].length,n:b[k].length}));
    scored.sort((a,c)=>c.avg-a.avg);
    const best=scored[0];
    peaks.push({k:f.k,l:f.l,lead:best.lead,avg:best.avg,n:best.n});
  });
  peaks.sort((a,b)=>b.avg-a.avg);
  return {starts:st,cycles,perLens,peaks};
}
function renderStats(){
  const a=analyze(), box=document.getElementById('stats');
  const note=document.getElementById('statsNote');
  if(!a.starts.length){
    box.innerHTML='<div class="note">还没有经期记录。先在「经期状态」里把今天标成「第1天」，统计就会开始长出来。</div>';
    note.textContent=''; return;
  }
  let h='';
  h+='<div class="split">';
  h+='<div><div class="lab2">平均周期</div><div class="big">'+(a.cycles.length?(a.cycles.reduce((x,y)=>x+y,0)/a.cycles.length).toFixed(1):'—')+'</div><div class="lab2">天</div></div>';
  h+='<div><div class="lab2">平均经期</div><div class="big">'+(a.perLens.length?(a.perLens.reduce((x,y)=>x+y,0)/a.perLens.length).toFixed(1):'—')+'</div><div class="lab2">天</div></div>';
  h+='</div>';
  if(a.peaks.length){
    h+='<div style="margin-top:16px"><div class="k" style="font-size:13px;color:var(--ink2);margin-bottom:6px">谁最会提前报警（= 经期开始前第几天达到峰值）</div>';
    a.peaks.slice(0,6).forEach(p=>{
      const pct=Math.min(100,p.avg/3*100);
      const when=p.lead===0?'经期当天':'经期前 '+p.lead+' 天';
      h+='<div class="stat"><div class="bar"><span class="t">'+p.l+'</span><span class="v">'+when+'</span></div>'
        +'<div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';
    });
    h+='</div>';
  }
  box.innerHTML=h;
  const cyc=a.cycles.length;
  note.textContent = cyc<2
    ? '目前只有 '+cyc+' 个完整周期，结论仅供参考。再记满 2 个周期（也就是差不多两个月）会更准。'
    : '基于 '+cyc+' 个完整周期、'+a.starts.length+' 次经期记录。';
}

/* ---------- 热力图 ---------- */
function renderHeat(){
  const box=document.getElementById('heat'); box.innerHTML='';
  ['一','二','三','四','五','六','日'].forEach(d=>{
    const c=document.createElement('div'); c.className='dow'; c.textContent=d; box.appendChild(c);
  });
  const t=today(); const start=addDays(t,-83);
  const dow=(parseD(start).getDay()+6)%7;
  for(let i=0;i<dow;i++){ const c=document.createElement('div'); c.className='cell'; c.style.background='transparent'; box.appendChild(c); }
  for(let i=0;i<84;i++){
    const d=addDays(start,i);
    const c=document.createElement('div');
    const e=S.entries[d];
    let bg='#F0EAE0';
    if(e){
      const sc=entryScore(e);
      if(sc!=null){
        if(sc<0.9) bg='#F0EAE0';
        else if(sc<1.6) bg='#E7D4C4';
        else if(sc<2.2) bg='#E0B49B';
        else if(sc<2.7) bg='#D08C7A';
        else bg='#D89A9A';
      }
    }
    c.className='cell'+(d===t?' today':'');
    c.style.background=bg;
    c.textContent=parseD(d).getDate();
    if(e&&e.periodDay>0){ const p=document.createElement('span'); p.className='dotp'; c.appendChild(p); c.style.background=bg==='#F0EAE0'?'#F2DCDC':bg; }
    c.title=d+(e?' '+JSON.stringify(e):' 无记录');
    c.onclick=()=>{ const dt=prompt('把记录改到哪一天？格式 YYYY-MM-DD',d); if(dt&&/^\d{4}-\d{2}-\d{2}$/.test(dt)){ S.entries[dt]=e||{}; if(e) delete S.entries[d]; save(); render(); } };
    box.appendChild(c);
  }
}

/* ---------- 导出 / 导入 ---------- */
function download(name,content,type){
  const b=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b); const a=document.createElement('a');
  a.href=u;a.download=name;a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function exportCsv(){
  const head=['日期','周期日','经前天数'];
  PHYS.forEach(f=>head.push('生理_'+f.l));
  MIND.forEach(f=>head.push('精神_'+f.l));
  head.push('不适综合分','喝冰的','咖啡因','运动','备注');
  const rows=[head.join(',')];
  Object.keys(S.entries).sort().forEach(d=>{
    const e=S.entries[d]; const ns=nextPeriodStart(d);
    const lead=ns?diffDays(ns,d):'';
    const r=[d, e.periodDay||0, lead];
    PHYS.forEach(f=>r.push(e[f.k]==null?'':e[f.k]));
    MIND.forEach(f=>r.push(e[f.k]==null?'':e[f.k]));
    const sc=entryScore(e); r.push(sc==null?'':sc.toFixed(2));
    r.push(e.cold?'是':'否', e.caffeine==null?'':e.caffeine, e.exercise?'是':'否', '"'+String(e.note||'').replace(/"/g,'""')+'"');
    rows.push(r.join(','));
  });
  download('身体日记.csv','\ufeff'+rows.join('\n'),'text/csv;charset=utf-8');
  flash('CSV 已导出');
}
document.getElementById('btnCsv').onclick=exportCsv;
document.getElementById('btnJson').onclick=()=>{ download('身体日记.json',JSON.stringify(S,null,2),'application/json'); flash('JSON 已导出'); };
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d&&d.entries){ S=d; save(); render(); flash('导入成功'); } else flash('文件格式不对'); }catch(err){ flash('导入失败'); } };
  r.readAsText(f); e.target.value='';
};
document.getElementById('btnClear').onclick=()=>{ if(confirm('清空所有记录？不可撤销。')){ S={entries:{}}; save(); render(); } };
document.getElementById('btnToday').onclick=()=>{ document.getElementById('physRows').scrollIntoView({behavior:'smooth',block:'center'}); flash('从下面开始点'); };
document.getElementById('chkCold').onclick=function(){ const e=getEntry(today()); e.cold=!e.cold; save(); render(); };
document.getElementById('chkEx').onclick=function(){ const e=getEntry(today()); e.exercise=!e.exercise; save(); render(); };
document.getElementById('inpCaff').oninput=function(){ const e=getEntry(today()); if(this.value==='') delete e.caffeine; else e.caffeine=+this.value; save(); };
document.getElementById('inpNote').oninput=function(){ const e=getEntry(today()); if(this.value) e.note=this.value; else delete e.note; save(); };

render();
</script>
</body>
</html>
